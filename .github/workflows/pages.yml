name: Deploy Music Chat Lab to GitHub Pages
# release workflow: PR tests first, deploy only after merge to main

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test snapshot
        uses: actions/checkout@v4

      - name: JavaScript syntax check
        shell: bash
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Browser smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mcl-http.log 2>&1 &
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test .github/smoke.spec.js --reporter=line

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment snapshot
        uses: actions/checkout@v4

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mcl-pages"
          mkdir -p "$RUNNER_TEMP/mcl-pages"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'public/' \
            ./ "$RUNNER_TEMP/mcl-pages/"
          test -f "$RUNNER_TEMP/mcl-pages/index.html"
          test -f "$RUNNER_TEMP/mcl-pages/service-worker.js"
          test ! -e "$RUNNER_TEMP/mcl-pages/composition-engine22.js"
          test ! -e "$RUNNER_TEMP/mcl-pages/composition-engine14.js"
          grep -q "Composition Engine" "$RUNNER_TEMP/mcl-pages/index.html"
          grep -q "https://wibem1.github.io/Composition-Engine/composition-engine.js?v=2.1.0" "$RUNNER_TEMP/mcl-pages/index.html"
          test -f "$RUNNER_TEMP/mcl-pages/session-orchestrator.js"
          test -f "$RUNNER_TEMP/mcl-pages/midi-player.js"
          test -f "$RUNNER_TEMP/mcl-pages/music-file-processing.js"
          test -f "$RUNNER_TEMP/mcl-pages/clab-document-v1.js"
          test -f "$RUNNER_TEMP/mcl-pages/backup-manager.js"
          test -f "$RUNNER_TEMP/mcl-pages/diagnostic-enhancer.js"
          test -f "$RUNNER_TEMP/mcl-pages/state-vault.js"
          grep -Eq 'data-app-version>v[0-9]+\.[0-9]+\.[0-9]+<' "$RUNNER_TEMP/mcl-pages/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mcl-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
